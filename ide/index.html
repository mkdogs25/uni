<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weft IDE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M1 4h14M1 8h14M1 12h14' stroke='%235b6cff' stroke-width='2'/><path d='M4 1v14M12 1v14' stroke='%23e0a030' stroke-width='2'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="ide.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Weft <small>IDE</small></span>
  <span class="file-name" id="file-name"></span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="auto" checked> Auto-compile</label>
  <button id="run" title="Compile (Ctrl+Enter)">Compile</button>
  <button id="reset" title="Discard your edits to this file">Reset file</button>
</header>

<main class="layout">
  <nav class="files" aria-label="Files">
    <div class="files-head">
      <span>Files</span>
      <button id="new-file" title="New scratch file">+ New</button>
    </div>
    <ul id="file-list"></ul>
    <p class="files-foot">Edits are kept in this browser only.</p>
  </nav>

  <section class="editor-pane">
    <textarea id="editor"></textarea>
  </section>

  <section class="output-pane">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="preview" class="active">Preview</button>
      <button role="tab" data-tab="html">HTML</button>
      <button role="tab" data-tab="css">CSS</button>
      <button role="tab" data-tab="js">JS</button>
      <button role="tab" data-tab="tokens">Tokens</button>
      <button role="tab" data-tab="ast">AST</button>
      <button role="tab" data-tab="problems">Problems <span id="problem-count" class="badge"></span></button>
    </div>
    <div class="tab-body">
      <iframe id="tab-preview" class="panel active" title="Preview" sandbox="allow-scripts"></iframe>
      <pre id="tab-html" class="panel"></pre>
      <pre id="tab-css" class="panel"></pre>
      <pre id="tab-js" class="panel"></pre>
      <pre id="tab-tokens" class="panel"></pre>
      <pre id="tab-ast" class="panel"></pre>
      <div id="tab-problems" class="panel"></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="status">Starting…</span>
  <span class="spacer"></span>
  <span id="phase"></span>
  <a href="https://github.com/mkdogs25/uni" target="_blank" rel="noopener">Source</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="weft-mode.js"></script>
<script src="ide.js"></script>
</body>
</html>
